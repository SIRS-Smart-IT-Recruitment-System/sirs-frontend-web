<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>CapyByte · Đang tải</title>
  <style>
    :root {
      --cycle: 0.6s;
      --ease: cubic-bezier(.38, .04, .58, .97);
      background: transparent;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body { display: grid; place-items: center; }
    svg {
      display: block;
      width: min(100vw, 100vh, 22rem);
      width: min(100vw, 100dvh, 22rem);
      height: auto;
      overflow: hidden;
    }
    .outline { stroke: #483248; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    /* All pivots use the same 320 × 320 coordinate system as the artwork. */
    #body, #head, #orange, #shadow, .arm, .leg, .shin {
      transform-box: view-box;
      animation-duration: var(--cycle);
      animation-timing-function: var(--ease);
      animation-iteration-count: infinite;
    }
    #body { transform-origin: 152px 226px; animation-name: body-rise; }
    #head { transform-origin: 156px 163px; animation-name: head-follow; }
    #orange { transform-origin: 157px 81px; animation-name: leaf-balance; }
    #shadow { transform-origin: 153px 280px; animation-name: ground-shadow; }
    .leg { transform-origin: 149px 226px; animation-name: thigh; }
    .shin { transform-origin: 149px 251px; animation-name: lower-leg; }
    #left-arm { transform-origin: 151px 183px; animation-name: carry; }
    #right-arm { transform-origin: 174px 180px; animation-name: swing; }
    #right-leg, #right-leg .shin { animation-delay: calc(var(--cycle) / -2); }

    /* Each half-cycle: contact → compression → push-off → flight.
       The opposite foot takes over at 50%. */
    @keyframes body-rise {
      0%, 50%, 100% { transform: translateY(0); }
      10%, 60% { transform: translateY(3px); }
      30%, 80% { transform: translateY(-1px); }
      40%, 90% { transform: translateY(-8px); }
    }
    @keyframes head-follow {
      0%, 50%, 100% { transform: translateY(0) rotate(-1deg); }
      13%, 63% { transform: translateY(1.5px) rotate(1.5deg); }
      42%, 92% { transform: translateY(-.7px) rotate(-1.6deg); }
    }
    @keyframes thigh {
      0%, 100% { transform: rotate(-31deg); }
      10% { transform: rotate(-25deg); }
      30% { transform: rotate(8deg); }
      48% { transform: rotate(34deg); }
      61% { transform: rotate(18deg); }
      81% { transform: rotate(-45deg); }
    }
    @keyframes lower-leg {
      0%, 100% { transform: rotate(17deg); }
      10% { transform: rotate(57deg); }
      30% { transform: rotate(6deg); }
      48% { transform: rotate(24deg); }
      63% { transform: rotate(81deg); }
      81% { transform: rotate(61deg); }
    }
    @keyframes swing {
      0%, 100% { transform: rotate(-27deg); }
      48% { transform: rotate(28deg); }
    }
    @keyframes carry {
      0%, 100% { transform: rotate(9deg); }
      48% { transform: rotate(-12deg); }
    }
    @keyframes leaf-balance {
      0%, 50%, 100% { transform: rotate(-2deg); }
      22%, 72% { transform: rotate(2deg); }
    }
    @keyframes ground-shadow {
      0%, 50%, 100% { transform: scale(1, 1); opacity: .22; }
      10%, 60% { transform: scale(1.07, 1.03); opacity: .26; }
      40%, 90% { transform: scale(.72, .78); opacity: .12; }
    }
    @media (prefers-reduced-motion: reduce) {
      #body, #head, #orange, #shadow, .arm, .leg, .shin { animation: none; }
      #left-leg { transform: rotate(-9deg); }
      #right-leg { transform: rotate(13deg); }
      #shadow { opacity: .2; }
    }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="mascot-title">
    <title id="mascot-title">Đang tải · CapyByte chạy bộ, ôm laptop và đội quả cam Git</title>
    <defs>
      <!-- Rounded caps overlap at the knee, so the joint stays closed at every angle. -->
      <path id="thigh-shape" d="M135 224 Q136 212 149 212 Q164 212 164 227 L158 251 Q157 260 149 260 Q140 260 138 250Z"/>

    <g id="shadow" fill="#526780" opacity=".22">
      <ellipse cx="153" cy="280" rx="48" ry="4.5"/>
    </g>

    <g id="body">
      <!-- Far hip is ten units ahead of the near hip in this three-quarter view. -->
      <g transform="translate(10 -1)">
        <g id="right-leg" class="leg" fill="#9c6449">
          <use href="#thigh-shape"/>
          <g class="shin"><use href="#shin-shape"/>

      <g id="hoodie" class="outline">

        <path d="M127 153 Q110 144 99 153 Q91 163 103 175 Q118 189 143 181 L163 162Z" fill="#334e9b"/>

      <g id="head" class="outline">

        <path d="M157 81 Q174 62 183 74 Q190 85 179 98Z" fill="#a7704c"/>

        <path d="M103 125 Q108 155 147 160 Q164 165 193 162 Q211 163 223 155 Q214 172 188 172 Q145 178 120 160 Q106 151 103 140Z" fill="#b57b53" stroke="none"/>
        <path d="M176 121 Q189 111 208 116 Q218 119 227 125 Q237 132 231 148 Q224 164 201 165 Q182 166 168 156 Q159 146 163 135 Q167 126 176 121Z" fill="#dfab7a" stroke="none"/>
        <path d="M108 102 Q98 100 96 91 Q95 79 104 78 Q117 76 121 89 Q120 97 115 100" fill="#be8256"/>
        <path d="M102 89 Q105 84 111 91" fill="none" stroke="#8a5742" stroke-width="4"/>
        <path d="M139 102 Q146 97 153 101 M183 100 Q188 97 193 100" fill="none" stroke="#88563e" stroke-width="3"/>
        <path d="M142 114 Q149 118 155 112 M185 110 Q190 114 194 109" fill="none" stroke="#452e32" stroke-width="3.4"/>
        <g fill="none" stroke="#30384b" stroke-width="2.6">
          <path d="M106 106 L130 114 M167 111 Q171 105 176 108"/>
          <ellipse cx="149" cy="114" rx="18.4" ry="19.5" transform="rotate(-7 149 114)"/>
          <ellipse cx="190" cy="109" rx="13.6" ry="16.8" transform="rotate(-10 190 109)"/>
        </g>
        <path d="M137 107 Q139 103 143 102 M182 104 L185 101" fill="none" stroke="#ffefd2" stroke-width="2.2"/>
        <path d="M218 124 Q223 122 225 126 Q224 131 219 131 Q216 129 218 124Z" fill="#5c413b" stroke="none"/>
        <path d="M191 150 Q203 158 214 148" stroke="#744b40" fill="none"/>
        <path d="M177 140 L179 140 M182 136 L184 136 M185 142 L187 142" stroke="#bd835e" stroke-width="2.6"/>

        <g id="orange">
          <path d="M153 81 C138 81 130 71 131 59 C131 47 141 40 153 41 Q158 42 162 40 C174 38 183 47 184 59 C186 73 173 82 161 81Z" fill="#fa992e"/>
          <path d="M136 65 Q145 79 163 77 Q176 76 182 65 Q178 81 160 81 Q141 82 136 69Z" fill="#e97b29" stroke="none"/>
          <path d="M154 42 Q154 34 151 31" fill="none" stroke="#6a6746" stroke-width="3.5"/>
          <path d="M155 38 Q163 23 181 29 Q174 40 155 38Z" fill="#77a85f" stroke="#4d7650" stroke-width="2"/>
          <path d="M145 48 Q140 49 138 54" fill="none" stroke="#ffd38a" stroke-width="3"/>
          <g fill="#e7fffa" stroke="#186c78" stroke-width="1.8">
            <path d="M154 53 L154 69 M154 62 Q166 62 166 56" fill="none" stroke="#186c78" stroke-width="3"/>
            <circle cx="154" cy="52" r="2.8"/><circle cx="154" cy="69" r="2.8"/><circle cx="166" cy="54" r="2.8"/>
          </g>
        </g>
      </g>

      <g id="left-arm" class="arm outline">
        <!-- The laptop travels with the near forearm so the grip stays closed. -->
        <g transform="rotate(8 152 205)">
          <rect x="127" y="183" width="49" height="39" rx="5" fill="#b7d0e7"/>
          <path d="M132 218 H171" stroke="#8da8c6" stroke-width="2"/>
          <path d="M148 197 L143 202 L148 206 M157 197 L162 201 L157 206" fill="none" stroke="#317499" stroke-width="2.2"/>
          <path d="M154 196 L151 207" stroke="#7a60a3" stroke-width="2"/>
        </g>
        <path d="M144 172 Q133 173 129 183 L119 200 Q114 209 122 215 Q131 221 139 212 L152 194 Q160 185 155 177 Q151 172 144 172Z" fill="#497cdb"/>
        <path d="M123 197 Q130 204 141 206 L136 214 Q130 221 121 215 Q115 210 118 205Z" fill="#827bd2"/>
        <path d="M130 209 Q134 205 139 205 L145 201 Q148 199 150 202 Q154 202 155 206 Q157 212 151 216 L140 222 Q133 223 129 218 Q126 214 130 209Z" fill="#ca956d"/>
        <path d="M144 212 L150 209" fill="none" stroke="#996647" stroke-width="2"/>
      </g>
    </g>
  </svg>
</body>
</html>
