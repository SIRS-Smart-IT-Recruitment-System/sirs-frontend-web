<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <title>CapyByte – SIRS IT Mascot với Hoodie xanh, Kính IT, Quả cam Git và Laptop</title>
  
  <defs>
    <!-- Ground glow -->
    <radialGradient id="capyGround" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.32"/>
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Royal Blue Hoodie Gradient -->
    <linearGradient id="hoodieGrad" x1="15%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Hoodie Shadow -->
    <linearGradient id="hoodieShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Orange Tangerine Gradient -->
    <radialGradient id="orangeGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="25%" stop-color="#fb923c"/>
      <stop offset="85%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>

    <!-- Metallic Laptop Gradient -->
    <linearGradient id="laptopMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Glasses Glass Reflection -->
    <linearGradient id="lensGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Ground contact shadow -->
  <ellipse cx="112" cy="180" rx="84" ry="9" fill="url(#capyGround)"/>

  <!-- Planted feet (outside breathing torso) -->
  <g stroke="#4a2e1b" stroke-width="2.6">
    <!-- Back hind foot -->
    <path fill="#a86d42" d="M66 148 q-5 10 -7 22 c-9 1 -15 5 -13 10 c2 4 21 4 29 -1 l7 -26 Z"/>
    <!-- Front foot paw base -->
    <path fill="#bb7f4f" d="M154 152 c-12 0 -19 7 -17 16 c-8 0 -13 4 -12 8 c1 4 12 5 24 3 c11 -1 20 -6 22 -14 c1 -7 -5 -13 -17 -13 Z"/>
    <!-- Toes accents -->
    <path d="M68 174 q1 -3 3 -4 m2 6 q1 -3 3 -5" stroke="#784524" stroke-width="1.8"/>
    <path d="M132 174 q1 -3 3 -4 m3 5 q1 -3 3 -4" stroke="#784524" stroke-width="1.8"/>
  </g>

  <!-- BODY (Breathing Torso + Royal Blue Hoodie + Laptop) -->
  <g data-part="body" stroke="#3b2518" stroke-width="2.8">
    <!-- Fur back curve underneath hoodie -->
    <path fill="#b87948" d="M74 88 c18 -18 46 -17 70 -11 c28 7 48 30 51 56 c4 26 -10 38 -35 39 l-50 -1 c-24 -1 -41 -13 -42 -33 c-2 -16 0 -33 9 -49 Z"/>
    <path fill="#9c6135" stroke="none" d="M190 133 c0 23 -11 30 -34 31 l-52 -1 c-11 0 -21 -4 -29 -9 c8 11 20 15 31 15 l50 1 c24 -1 36 -12 34 -37 Z"/>

    <!-- ROYAL BLUE HOODIE -->
    <path fill="url(#hoodieGrad)" stroke="#1e3a8a" stroke-width="2.8"
          d="M74 96 C86 86 112 84 135 91 C162 99 180 120 183 145 C185 162 174 172 153 173 L106 172 C85 171 73 158 72 142 C71 127 71 110 74 96 Z"/>
    
    <!-- Hoodie lower fold shadow -->
    <path fill="url(#hoodieShadow)" stroke="none"
          d="M75 146 C79 162 90 171 108 172 L152 173 C173 172 183 162 182 147 C174 158 158 165 140 165 L102 165 C88 165 79 157 75 146 Z"/>

    <!-- Kangaroo pocket on hoodie -->
    <path fill="#1d4ed8" stroke="#1e3a8a" stroke-width="2"
          d="M92 134 C104 130 126 130 138 134 C146 137 149 146 148 158 L82 158 C81 146 84 137 92 134 Z"/>
    <!-- Pocket hands entry slant -->
    <path d="M90 138 L84 152 M140 138 L146 152" stroke="#60a5fa" stroke-width="1.8" opacity="0.7"/>

    <!-- SIRS Logo Badge on Hoodie Chest -->
    <g transform="translate(138, 108)" stroke="none">
      <rect x="-2" y="-2" width="28" height="14" rx="4" fill="#0f172a" opacity="0.88"/>
      <rect x="-2" y="-2" width="28" height="14" rx="4" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.95"/>
      <text x="3" y="8.5" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="800" fill="#ffffff" letter-spacing="0.6">SIRS</text>
      <circle cx="22" cy="5" r="1.8" fill="#38bdf8"/>
    </g>

    <!-- SILVER TECH LAPTOP (Resting on lap / held in front) -->
    <g stroke="#334155" stroke-width="2.2">
      <!-- Laptop base / keyboard plate -->
      <polygon points="84,142 142,130 152,154 94,166" fill="url(#laptopMetal)"/>
      <polygon points="86,143 140,132 148,151 94,162" fill="#475569" opacity="0.3" stroke="none"/>
      
      <!-- Laptop lid / screen back upright -->
      <polygon points="84,142 98,110 154,100 142,130" fill="url(#laptopMetal)" stroke="#1e293b" stroke-width="2.2"/>
      <!-- Lid metallic specular highlight line -->
      <path d="M98 112 L152 102" stroke="#ffffff" stroke-width="1.8" opacity="0.8"/>

      <!-- STICKERS ON LAPTOP LID -->
      <!-- Sticker 1: Code brackets </> -->
      <g transform="translate(104, 115) rotate(-10)" stroke="none">
        <rect x="0" y="0" width="15" height="10" rx="2.2" fill="#090d16"/>
        <rect x="0" y="0" width="15" height="10" rx="2.2" fill="none" stroke="#22d3ee" stroke-width="0.8"/>
        <text x="2" y="7.5" font-family="monospace" font-size="6.5" font-weight="bold" fill="#22d3ee">&lt;/&gt;</text>
      </g>
      <!-- Sticker 2: Rocket 🚀 -->
      <g transform="translate(124, 111) rotate(5)" stroke="none">
        <circle cx="5" cy="5" r="5" fill="#ec4899"/>
        <path d="M3 7 L7 3 M5 2 L8 2 L8 5 M3 5 L5 7" stroke="#ffffff" stroke-width="1.2" fill="none"/>
      </g>
      <!-- Sticker 3: Coffee ☕ -->
      <g transform="translate(133, 118) rotate(-6)" stroke="none">
        <circle cx="4.5" cy="4.5" r="4.5" fill="#f59e0b"/>
        <path d="M3 4 L6 4 L5.5 7 L3.5 7 Z" fill="#ffffff"/>
        <path d="M6 4.5 Q7.5 4.5 7.5 5.5 Q7.5 6.5 6 6.5" stroke="#ffffff" stroke-width="0.8" fill="none"/>
      </g>
    </g>

    <!-- SCARF / HOODIE COLLAR & DRAWSTRINGS (Pivots at 92px 99px) -->
    <g data-part="scarf" stroke="#1e3a8a" stroke-width="2.6">
      <!-- Hoodie collar ring -->
      <path fill="#2563eb" d="M62 90 C76 99 104 98 119 88 L124 100 C106 113 78 116 61 106 C56 103 56 96 62 90 Z"/>
      <path d="M65 104 C78 109 94 108 108 101" stroke="#93c5fd" opacity="0.6" stroke-width="2" fill="none"/>
      <path fill="#1d4ed8" d="M108 92 Q114 85 120 90 L122 96 Q118 103 111 102 Z"/>
      
      <!-- Hoodie drawstrings swinging gently with breathing -->
      <path d="M78 105 Q79 120 76 128 M94 105 Q93 118 96 126" stroke="#ffffff" stroke-width="2" fill="none"/>
      <!-- Metal aglets (tips) -->
      <circle cx="76" cy="129" r="1.6" fill="#38bdf8" stroke="#0f172a" stroke-width="1"/>
      <circle cx="96" cy="127" r="1.6" fill="#38bdf8" stroke="#0f172a" stroke-width="1"/>
    </g>

    <!-- HEAD (Pivots at 95px 96px) -->
    <g data-part="head" stroke="#3b2518" stroke-width="2.8">
      <!-- Far ear (data-part="far-ear") -->
      <g data-part="far-ear">
        <path fill="#a86d42" d="M71 49 C57 42 58 24 68 24 C76 23 83 32 80 44 Z"/>
        <path d="M68 32 Q74 33 74 40" stroke="#784524" stroke-width="2" fill="none"/>
      </g>

      <!-- Head main chubby silhouette -->
      <path fill="#c98954" d="M30 60 C37 53 40 47 48 43 C61 35 80 33 96 37 C120 42 129 59 127 78 C125 99 109 108 85 109 L47 108 C28 108 17 102 16 89 C15 77 17 67 30 60 Z"/>
      <!-- Snout & muzzle lighter fur highlight -->
      <path fill="#e5af7b" stroke="none" d="M18 88 C18 75 24 66 37 65 C51 63 61 69 65 80 C69 90 80 98 95 100 C85 107 70 107 51 106 C31 106 19 102 18 88 Z"/>

      <!-- Near ear (data-part="ear" - pivots at 104px 53px) -->
      <g data-part="ear">
        <path fill="#bf804c" d="M98 54 C96 45 99 33 108 31 C117 29 123 37 119 45 C117 50 112 55 107 57"/>
        <path d="M105 47 Q105 38 112 38" stroke="#784524" stroke-width="3.2" fill="none"/>
      </g>

      <!-- Forehead fur accent line -->
      <path d="M73 54 Q77 52 81 54" stroke="#8f552e" stroke-width="2.2" fill="none"/>

      <!-- NOSE -->
      <path fill="#331f14" stroke="#24150d" stroke-width="2.2"
            d="M18 72 C21 68 29 67 33 69 C35 71 32 76 28 78 L23 79 C19 79 16 75 18 72 Z"/>
      <circle cx="22" cy="74" r="1.2" fill="#1a0d07" stroke="none"/>

      <!-- MOUTH (data-part="mouth" - curves up when happy) -->
      <g data-part="mouth">
        <path d="M25 80 L26 86 Q31 94 41 88" stroke="#3b2518" stroke-width="2.8" fill="none"/>
      </g>

      <!-- Whiskers / cheek freckles -->
      <circle cx="38" cy="81" r="1" fill="#854d27" stroke="none"/>
      <circle cx="44" cy="83" r="1" fill="#854d27" stroke="none"/>
      <circle cx="40" cy="86" r="1" fill="#854d27" stroke="none"/>

      <!-- EYES & GAZE TRACKING (pivots at 76px 63px) -->
      <g data-part="gaze">
        <g data-part="eyes">
          <!-- Far eye (left side) -->
          <ellipse cx="36" cy="60.5" rx="2.6" ry="3.4" fill="#24150d" stroke="none"/>
          <circle cx="35.2" cy="59.5" r="0.9" fill="#ffffff" stroke="none"/>

          <!-- Near eye (main expressive eye) -->
          <ellipse cx="76" cy="63.5" rx="4.6" ry="5.2" fill="#1f120a" stroke="none"/>
          <!-- Eye shine / highlights -->
          <ellipse cx="74.8" cy="61.8" rx="1.6" ry="1.9" fill="#ffffff" stroke="none"/>
          <circle cx="77.8" cy="65.2" r="0.8" fill="#93c5fd" stroke="none"/>
        </g>
      </g>

      <!-- SMART IT DEV GLASSES (Retro round frames) -->
      <g stroke="#0f172a" stroke-width="2.4" fill="none">
        <!-- Left lens frame -->
        <ellipse cx="36" cy="61" rx="8.5" ry="10.5" fill="url(#lensGlass)"/>
        <!-- Right lens frame -->
        <circle cx="76" cy="63.5" r="12.5" fill="url(#lensGlass)"/>
        <!-- Glasses bridge over snout -->
        <path d="M44.5 59.5 Q54 55.5 63.5 59.5" stroke-width="2.6"/>
        <!-- Glasses temple piece towards ear -->
        <path d="M88.5 62 Q97 59.5 104 57" stroke-width="2.2"/>
        <!-- Glass gleam reflection -->
        <line x1="71" y1="55" x2="81" y2="71" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>
      </g>

      <!-- THE SIRS TANGERINE ON HEAD WITH GIT BRANCH (🍊) -->
      <g stroke="#7c2d12" stroke-width="1.8">
        <!-- Stem & fresh green leaf -->
        <path d="M68 6 Q68 2 71 1" stroke="#542a0c" stroke-width="2" fill="none"/>
        <path d="M70 4 Q79 1 81 8 Q74 8 70 4 Z" fill="#22c55e" stroke="#15803d" stroke-width="1.4"/>
        
        <!-- Tangerine body -->
        <ellipse cx="68" cy="18" rx="14.5" ry="13.5" fill="url(#orangeGrad)"/>
        <!-- Peel specular shine -->
        <ellipse cx="63" cy="13" rx="4" ry="2.5" fill="#ffffff" opacity="0.4" stroke="none"/>

        <!-- THE KEY SIRS IDENTITY: GIT BRANCH ICON ON ORANGE -->
        <g stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <!-- Git trunk line -->
          <line x1="63.5" y1="24" x2="63.5" y2="13.5"/>
          <!-- Git branch curve -->
          <path d="M63.5 20 Q66 20 71 16.5 L71 13.5" fill="none"/>
          <!-- Git Commit Nodes (white ring + cyan glowing center) -->
          <circle cx="63.5" cy="24" r="2" fill="#38bdf8" stroke="#ffffff" stroke-width="0.9"/>
          <circle cx="63.5" cy="13" r="2" fill="#38bdf8" stroke="#ffffff" stroke-width="0.9"/>
          <circle cx="71" cy="13" r="2" fill="#38bdf8" stroke="#ffffff" stroke-width="0.9"/>
        </g>
      </g>
    </g>
  </g>

  <!-- FRONT PAW (data-part="paw" - Pivots at 87px 123px, waves when greeting) -->
  <g data-part="paw" stroke="#3b2518" stroke-width="2.6">
    <!-- Chubby forearm & paw resting on laptop or waving -->
    <path fill="#c98954" d="M78 116 C76 125 77 140 76 153 C69 155 62 158 62 164 C62 172 81 172 88 166 C94 160 97 142 98 131 Z"/>
    <!-- Cute paw toes/pads -->
    <path d="M68 166 Q69 162 72 161 M74 167 Q75 163 78 161" stroke="#784524" stroke-width="2" fill="none"/>
  </g>

  <!-- CELEBRATION GLINTS (data-part="glints" - High-tech star sparkles) -->
  <g data-part="glints" opacity="0" stroke="none">
    <!-- Main golden tech star -->
    <path fill="#fbbf24" d="M141 29 Q143 37 149 39 Q143 41 141 49 Q139 41 133 39 Q139 37 141 29 Z"/>
    <!-- Cyan star -->
    <path fill="#38bdf8" d="M156 21 Q157 26 161 27 Q157 28 156 33 Q155 28 151 27 Q155 26 156 21 Z"/>
    <!-- Mini sparkle dot -->
    <circle cx="135" cy="21" r="2" fill="#ffffff"/>
    <circle cx="162" cy="42" r="1.8" fill="#67e8f9"/>
  </g>
</svg>
